name: Build Play Store bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown on Google Play (e.g. 1.2.0). Leave empty to keep the one in build.gradle.kts.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: play-signing
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Pick the version
        env:
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Every run gets a new, higher versionCode, so an upload is never rejected as a duplicate.
          # The offset keeps it above the codes that were set by hand before (up to 22).
          version_code=$((100 + RUN_NUMBER))
          if [ -n "$VERSION_NAME_INPUT" ] && ! printf '%s' "$VERSION_NAME_INPUT" | grep -Eq '^[0-9A-Za-z.+-]{1,40}$'; then
            echo "::error::version_name may only contain letters, digits, '.', '+' and '-'"
            exit 1
          fi
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME_INPUT" >> "$GITHUB_ENV"

      - name: Build release bundle
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" \
            :app:testReleaseUnitTest :app:bundleRelease

      - name: Sign bundle with the Play upload key
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${PLAY_UPLOAD_KEYSTORE_BASE64:?Set PLAY_UPLOAD_KEYSTORE_BASE64 in the play-signing environment}"
          : "${PLAY_UPLOAD_STORE_PASSWORD:?Set PLAY_UPLOAD_STORE_PASSWORD in the play-signing environment}"
          : "${PLAY_UPLOAD_KEY_ALIAS:?Set PLAY_UPLOAD_KEY_ALIAS in the play-signing environment}"
          : "${PLAY_UPLOAD_KEY_PASSWORD:?Set PLAY_UPLOAD_KEY_PASSWORD in the play-signing environment}"

          keystore=$(mktemp "$RUNNER_TEMP/play-upload.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          jarsigner -keystore "$keystore" \
            -storepass:env PLAY_UPLOAD_STORE_PASSWORD \
            -keypass:env PLAY_UPLOAD_KEY_PASSWORD \
            -signedjar BENG-play-release.aab \
            app/build/outputs/bundle/release/app-release.aab "$PLAY_UPLOAD_KEY_ALIAS"
          jarsigner -verify BENG-play-release.aab

      - name: Show the version
        run: |
          shown_name="${VERSION_NAME:-the one in build.gradle.kts}"
          echo "### BENG bundle: versionCode $VERSION_CODE, versionName $shown_name" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: BENG-play-release-${{ env.VERSION_CODE }}
          path: BENG-play-release.aab
          if-no-files-found: error
          retention-days: 14
