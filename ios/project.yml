# Generate the Xcode project with XcodeGen:  brew install xcodegen && cd ios && xcodegen generate
name: BENG
options:
  bundleIdPrefix: com.caglaryildiz
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team here (or in Xcode › Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  BENG:
    type: application
    platform: iOS
    sources:
      - path: BENG
      - path: Core
    info:
      path: BENG/Info.plist
      properties:
        CFBundleDisplayName: BENG
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations: [en, tr, de, fr, es, it, pt-BR, nl, ja, ko, zh-Hant, ar, th, id]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch, audio]
        BGTaskSchedulerPermittedIdentifiers: [com.caglaryildiz.alarm.refresh]
        NSAlarmKitUsageDescription: BENG schedules your alarms so they ring even in silent mode and during Focus.
        NSCameraUsageDescription: The camera scans the QR code that turns off your alarm. Nothing is recorded or sent.
        NSMotionUsageDescription: Motion and step data are used only while a shake or walking mission is open, to turn off the alarm.
    entitlements:
      path: BENG/BENG.entitlements
      properties:
        com.apple.security.application-groups: [group.com.caglaryildiz.alarm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caglaryildiz.alarm
        PRODUCT_NAME: BENG
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: BENGWidget
  BENGWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BENGWidget
      - path: Core
      - path: BENG/Resources/Localization
    info:
      path: BENGWidget/Info.plist
      properties:
        CFBundleDisplayName: BENG
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BENGWidget/BENGWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.caglaryildiz.alarm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caglaryildiz.alarm.widget
        PRODUCT_NAME: BENGWidget
        SKIP_INSTALL: YES
  BENGTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BENGTests
    dependencies:
      - target: BENG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caglaryildiz.alarm.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BENG.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BENG
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BENG:
    build:
      targets:
        BENG: all
        BENGTests: [test]
    run:
      config: Debug
      storeKitConfiguration: BENG/BENG.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets: [BENGTests]
    archive:
      config: Release
